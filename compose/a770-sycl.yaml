# A770 llama.cpp SYCL server — the container ENVELOPE only.
# The SYCL sibling of compose/a770-vulkan.yaml. It carries what the container needs to reach the card and the
# weights: the image, the two PCI DRM nodes, the host render/video group ids, the SYCL device selector, the
# read-only GGUF mount, the read-only API-key mount, and the loopback port. It carries NO model, NO context and
# NO llama-server argv: the profile row is turned into argv at serve time by harness/serve_compose.sh from
# config/profiles*.json, so the registry stays the single source.
#
# The image is ghcr.io/ggml-org/llama.cpp:full-intel — llama.cpp built with SYCL (oneAPI / Level Zero) support,
# the A770/DG2-compatible Intel path. Unlike vLLM's XPU line (Xe2-only, which refuses DG2), SYCL runs on DG2.
# Use full-intel, NOT server-intel: full copies build/bin/* so the one-shot llama-bench job (the speed rung) is
# in the same image. Pin it by digest after the first pull (compose/a770-sycl.env).
#
# The image's own ENTRYPOINT is /app/tools.sh (a toolbox shell); compose appends `command:` to the entrypoint, so
# without the explicit entrypoint below a serve would run tools.sh and never reach the server. The ruled start
# path is `local-build.sh serve` with A770B_SERVE=compose and A770B_COMPOSE_FILE pointing here, NOT a bare
# `docker compose up`: that skips the profile argv, the budget gate, the VRAM cap and the live-backend sidecar.
#
# Passthrough is unmeasured until a host brings this up. Do NOT pass all of /dev/dri — that would expose a second
# Intel GPU on a two-card machine. The sandbox never sees a container socket.
services:
  llama:
    image: ${A770B_LLAMA_IMAGE}
    restart: "no"
    user: "${A770B_CONTAINER_UID}:${A770B_CONTAINER_GID}"
    group_add:
      - "${A770B_RENDER_GID}"
      - "${A770B_VIDEO_GID}"
    # long syntax: the host path is a PCI by-path node, and its colon (`pci-0000:0b:00.0-render`) makes compose's
    # short `host:container` form ambiguous. `permissions` is the cgroup access field — omitting it leaves runc's
    # device-access rule empty ("device access ... field cannot be empty"), so it is stated explicitly.
    devices:
      - source: "${A770B_DRM_CARD}"
        target: /dev/dri/card0
        permissions: "rwm"
      - source: "${A770B_DRM_RENDER}"
        target: /dev/dri/renderD128
        permissions: "rwm"
    # the trailing `z` relabels the host source for SELinux (Fedora/RHEL): without it the container's container_t
    # cannot read a user-home file, and the API-key (and model) mount is denied. `z` = shared, not exclusive.
    volumes:
      - "${A770B_MODELS}:/models:ro,z"
      - "${A770B_API_KEY_FILE}:/run/a770b/api.key:ro,z"
    environment:
      # SYCL device selection: the level-zero backend. Passing only the A770's two DRM nodes already hides the
      # neighbour card; this selector names the backend explicitly (index 0 inside the container is the A770).
      ONEAPI_DEVICE_SELECTOR: "${A770B_ONEAPI_DEVICE_SELECTOR}"
    ports:
      - "127.0.0.1:${A770B_PORT}:8080"
    entrypoint: ["/app/llama-server"]
