# vLLM container server — the container ENVELOPE only.
# The vLLM sibling of compose/a770-vulkan.yaml and compose/a770-sycl.yaml. It carries what the
# container needs to reach the card and the weights: the image, the two PCI DRM nodes, the filtered
# by-path mount, the host render/video group ids, ipc: host, shm_size, CCL_ZE_IPC_EXCHANGE=sockets,
# the read-only model mount, the read-only API-key mount, and the loopback port. It carries NO model,
# NO context and NO vLLM argv: the profile row is turned into argv at serve time by
# harness/serve_compose.sh from config/profiles*.json, so the registry stays the single source.
#
# The image is intel/vllm:0.21.0-xpu (or pinned digest via A770B_VLLM_IMAGE).
# Pin it by digest after the first pull (compose/vllm.env).
#
# The ruled start path is `local-build.sh serve` with A770B_SERVE=compose and A770B_COMPOSE_FILE
# pointing here, NOT a bare `docker compose up`: that skips the profile argv, the budget gate,
# the VRAM cap and the live-backend sidecar.
services:
  llama:
    image: ${A770B_VLLM_IMAGE:-intel/vllm:0.21.0-xpu}
    restart: "no"
    ipc: host
    shm_size: 32g
    user: "${A770B_CONTAINER_UID}:${A770B_CONTAINER_GID}"
    group_add:
      - "${A770B_RENDER_GID}"
      - "${A770B_VIDEO_GID}"
    # long syntax: the host path is a PCI by-path node, and its colon (`pci-0000:0b:00.0-render`) makes compose's
    # short `host:container` form ambiguous. `permissions` is the cgroup access field — omitting it leaves runc's
    # device-access rule empty ("device access ... field cannot be empty"), so it is stated explicitly.
    devices:
      - source: "${A770B_DRM_CARD}"
        target: /dev/dri/card0
        permissions: "rwm"
      - source: "${A770B_DRM_RENDER}"
        target: /dev/dri/renderD128
        permissions: "rwm"
    # the trailing `z` relabels the host source for SELinux (Fedora/RHEL): without it the container's container_t
    # cannot read a user-home file, and the API-key (and model) mount is denied. `z` = shared, not exclusive.
    volumes:
      - "${A770B_MODELS}:/models:ro,z"
      - "${A770B_API_KEY_FILE}:/run/a770b/api.key:ro,z"
      - "${A770B_BY_PATH_DIR}:/dev/dri/by-path:ro"
    environment:
      CCL_ZE_IPC_EXCHANGE: sockets
    ports:
      - "127.0.0.1:${A770B_PORT}:8000"
    entrypoint: ["/bin/sh", "-c", "export VLLM_API_KEY=\"$(cat /run/a770b/api.key 2>/dev/null)\"; exec vllm serve \"$@\"", "vllm-serve"]
