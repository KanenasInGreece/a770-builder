<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logstats</title>
</head>
<body data-bar-meta="dashboard">

<header class="bar">
  <div class="bar-brand">
    <h1>logstats</h1>
    <div class="sub">Log-line statistics viewer</div>
  </div>
  <div class="bar-meta">
    <span class="live" id="live-label">live</span>
    <span class="bar-stat" id="bar-updated"><span class="bar-stat-k">Last updated</span> <span class="bar-stat-v" id="bar-updated-v">connecting…</span></span>
    <span class="bar-stat" id="bar-samples"><span class="bar-stat-v" id="bar-samples-v">—</span> <span class="bar-stat-k">samples</span></span>
    <span class="sub bar-status" id="bar-status" hidden></span>
  </div>
</header>

<main class="wrap">
  <!-- TODO(S1): a <label for="level"> and the level filter's <option>s (an "All" option
       plus one per level actually present in the loaded JSON's "by_level"). -->
  <select id="level"></select>

  <!-- TODO(S1): aria-live on this region, and the rendered statistics inside it (render.js's
       output, injected after fetching stats.json). -->
  <section id="stats"></section>
</main>

<script src="js/bar-meta.js"></script>
<!-- TODO(S1): an inline `<script type="module">` that imports ./js/render.js (and, through
     it, ./js/format.js), fetches "stats.json", renders the result into #stats, and re-renders
     filtered by #level's selected value on "change". -->

</body>
</html>
